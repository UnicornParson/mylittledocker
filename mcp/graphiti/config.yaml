
server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: "redis://falkordb:6379"
      database: "default_db"

llm:
  provider: "openai"
  model: "qwen2.5-7b-instruct"
  structured_output_mode: "json_object"
  providers:
    openai:
      api_key: "lm-studio-local-key"
      api_url: "http://host.docker.internal:1234/v1"

embedder:
  provider: "sentence_transformers"
  model: "all-MiniLM-L6-v2"
