services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    ports:
      - "${SEARXNG_PORT}:8080"

    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT}/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4

    volumes:
      - ${DATA_PATH}/searxng/config:/etc/searxng
      - ${DATA_PATH}/searxng/logs:/var/log/searxng

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp

    networks:
      - searxng

  crawler_endpoint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawler_endpoint
    restart: unless-stopped

    ports:
      - "${CRAWLER_PORT:-8000}:8000"
      - "${MCP_PORT:-8101}:8001"
      - "${FASTMCP_PORT:-8102}:8101"

    environment:
      - SEARXNG_URL=http://searxng:8080
      - DATA_PATH=/data
      - LOG_PATH=/data/access.log
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-10}
      - FETCH_TIMEOUT=${FETCH_TIMEOUT:-15}
      - FETCH_RETRIES=${FETCH_RETRIES:-2}
      - PLAYWRIGHT_ENABLED=true
      - SOCKS5_PROXY=${socks5_proxy:-}
      - MCP_HOST=0.0.0.0

    volumes:
      - ${DATA_PATH}/crawler/data:/data

    depends_on:
      searxng:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp

    networks:
      - searxng

networks:
  searxng:
    driver: bridge
