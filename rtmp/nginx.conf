user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    multi_accept on;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        application hlslive {
            live on;
            hls on;
            hls_path /usr/share/nginx/html/hlslive;
            hls_fragment 10s;
            hls_playlist_length 600s;
        }
    }
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ИСПРАВЛЕНО: Стандартные пути логов Nginx
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.apple.mpegurl;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    server {
        listen 5050;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        # ДОБАВЛЕНО: Корректная отдача HLS плейлистов (.m3u8)
        location /hlslive {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /usr/share/nginx/html;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}