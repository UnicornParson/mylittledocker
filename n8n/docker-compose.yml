services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    user: "1000:1000"
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOME:-localhost}
      - N8N_PORT=5678
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - GENERIC_TIMEZONE=Europe/Moscow
      - TZ=Europe/Moscow
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUN_TOKEN}
      - N8N_HTTP_REQUEST_TIMEOUT=1000000
      - EXECUTIONS_TIMEOUT=360000
      - EXECUTIONS_TIMEOUT_MAX=360000
    volumes:
      - ${N8N_HOME:-./n8n}:/home/node/.n8n
    depends_on:
      - n8n-runners

  n8n-runners:
    image: n8nio/runners:latest
    container_name: n8n-runners
    restart: always
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUN_TOKEN}