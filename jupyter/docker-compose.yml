
services:
  jupyter:
    restart: always
    build:
      context: '.'
      dockerfile: "./Dockerfile26"
    ports:
      - '8090:8000'
      - '8091:8001'
    volumes:
      - '${JUPYTER_HOME}:/home/data'
    shm_size: '4096m'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]